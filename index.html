<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5ea" />
    <!-- Home-screen icon: the Wine Simple grape cluster, one flat circle per
         step of the palate scale on cream paper. Source is favicon.svg; the
         PNGs are rendered from it with rsvg-convert, so edit the SVG and
         re-render rather than touching a PNG. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sip" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Three faces, three jobs, per DESIGN.md: Jost displays, Hanken Grotesk
         is read at size, Instrument Serif italic carries the tasting note and
         nothing else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Jost:wght@400;500;600&display=swap"
    />
    <title>Sip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
